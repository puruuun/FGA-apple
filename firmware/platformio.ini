; FGA iOS 브리지 펌웨어 (ESP32-C3)
; c3_usb  : 보드의 USB 단자가 칩에 직결된 보드 (SuperMini 등)
; c3_uart : USB-UART 변환칩(CH340/CP2102)이 있는 보드 (DevKitM/DevKitC 등)

[env]
platform = espressif32
framework = arduino
board = esp32-c3-devkitm-1
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@^2.3.0

[env:c3_usb]
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:c3_uart]
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
