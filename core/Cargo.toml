[workspace]
resolver = "3"
members = ["vision", "automata", "scripts", "cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"

[profile.dev.package.vision]
opt-level = 3
